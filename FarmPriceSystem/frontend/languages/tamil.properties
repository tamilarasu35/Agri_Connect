companion.field_recommendation=பிற்பகல் காய்ந்த காற்றில் காம்பு பலப்பட பளாட் ஏ தக்காளியில் காலை 9 மணிக்கு முன் 3% பஞ்சகவ்யா தெளிக்கவும்.
companion.escrow_guarantee_title=அரசு APMC தீர்வு மற்றும் e-NAM கட்டண பாதுகாப்பு
companion.pongal_heading=🌾 பொங்கல் சிறப்பு சந்தை | APMC மண்டி தேவை உயர்வு
companion.pongal_sub=பண்டிகை பயிர்களுக்கு மண்டி தேவை அதிகரிப்பு: கரும்பு (+40%), மஞ்சள் (+35%), தேங்காய் (+25%). நேரடி மண்டி வழிகாட்டுதல் தயார்.
